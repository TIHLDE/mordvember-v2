allowBuilds:
  esbuild: true
  unrs-resolver: true
# Same list for older pnpm versions (e.g. on Vercel) that don't read allowBuilds.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
overrides:
  "@esbuild-kit/core-utils>esbuild": ^0.25.0
  "@vercel/cli-config>zod": 4.6.7
  vite@*: "catalog:"
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
